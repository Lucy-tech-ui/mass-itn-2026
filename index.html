<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITN Mass Campaign - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        
        .phone-container {
            width: 375px; height: 812px; background-color: #f7f9f8; border-radius: 44px;
            box-shadow: 0 20px 45px -10px rgba(0, 32, 16, 0.15); overflow: hidden;
            display: flex; flex-direction: column; position: relative; border: 8px solid #333;
        }

        .app-header { background-color: #ffffff; padding: 48px 24px 28px 24px; border-bottom: 1px solid #eaeaea; }
        .moh-title-container { display: flex; align-items: center; gap: 16px; }
        .moh-seal-top { width: 52px; height: 52px; background: white; border-radius: 50%; padding: 2px; object-fit: contain; }
        .moh-text h1 { font-size: 16px; font-weight: 700; color: #11452a; }
        .moh-text p { font-size: 10px; color: #555555; line-height: 1.4; margin-top: 3px; }
        
        .partners-wrapper { margin-top: 24px; }
        .partners-label { font-size: 10px; font-weight: 800; color: #c78b16; text-transform: uppercase; }
        .partner-logos { display: flex; gap: 16px; background: #f1f5f2; padding: 12px; border-radius: 14px; margin-top: 8px; }
        .partner-logo { width: 48px; height: 48px; background: white; border-radius: 8px; padding: 4px; object-fit: contain; }

        .app-main { flex-grow: 1; padding: 28px 24px; }
        .login-card { background: white; width: 100%; border-radius: 20px; padding: 40px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .login-card h2 { text-align: center; margin-bottom: 32px; }
        
        .input-group { border: 1px solid #ddd; border-radius: 10px; padding: 0 18px; margin-bottom: 20px; display: flex; align-items: center; }
        .input-group input { width: 100%; padding: 18px 14px; border: none; outline: none; font-size: 15px; }
        
        .btn { width: 100%; padding: 18px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; margin-top: 10px; }
        .login-btn { background-color: #2b8146; color: white; }
        .scan-btn { background-color: transparent; border: 1px solid #1a1a1a; }
        
        .app-footer { background-color: #11452a; color: white; text-align: center; padding: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="app-header">
            <div class="moh-title-container">
                <img src="moh_logo.png" alt="MoH" class="moh-seal-top">
                <div class="moh-text">
                    <h1>MINISTRY OF HEALTH</h1>
                    <p>NATIONAL MALARIA CONTROL PROGRAMME<br>• SIERRA LEONE</p>
                </div>
            </div>
            <div class="partners-wrapper">
                <span class="partners-label">Implementing Partners</span>
                <div class="partner-logos">
                    <img src="who_logo.png" alt="WHO" class="partner-logo">
                    <img src="world-vision-logo.png" alt="WV" class="partner-logo">
                    <img src="global_fund.png" alt="GF" class="partner-logo">
                    <img src="NMCP.png" alt="NMCP" class="partner-logo">
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="login-card">
                <h2>Login</h2>
                <div class="input-group">
                    <input type="text" placeholder="Username" id="username">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" id="password">
                </div>
                <button class="btn login-btn" id="loginBtn">LOGIN</button>
                <button class="btn scan-btn">SCAN USER ID CARD</button>
            </div>
        </main>

        <footer class="app-footer">Powered by ICF-SL @ 2026</footer>
    </div>

    <script>
        // Credential and Page Mapping
        const userAccess = {
            "admin": { pass: "123456", pages: ["tabs.html"] },
            "hhr2026": { pass: "123", pages: ["RegForm.html", "ID card"] },
            "vv2026": { pass: "1234", pages: ["Dist.html", "ID card"] },
            "NatSup": { pass: "12345", pages: ["monitoring.html", "Dashboard.html", "ID card"] },
            "whm": { pass: "1231", pages: ["Stockmgt.html", "ID card"] },
            "Chsup": { pass: "1232", pages: ["Stockmgt.html", "devt.html", "Attendance.html","ID card"] },
            "DataM": { pass: "1233", pages: ["Dashboard.html", "Reconciliation.html", "ID card"] }
        };

        document.getElementById('loginBtn').addEventListener('click', function() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (userAccess[user] && userAccess[user].pass === pass) {
                // Open pages in new tabs
                userAccess[user].pages.forEach(page => {
                    window.open(page, '_blank');
                });
            } else {
                alert("Invalid Username or Password");
            }
        });
    </script>
</body>
</html>
