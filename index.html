<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Mass Campaign 2027</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f2f6ff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .app{
        width:100%;
        max-width:420px;
        background:#fff;
        border:2px solid #2b6cb0;
        border-radius:10px;
        overflow:hidden;
    }

    .header{
        text-align:center;
        padding:15px;
        font-weight:bold;
        background:#ffffff;
        border-bottom:2px solid #2b6cb0;
    }

    .header small{
        display:block;
        font-weight:normal;
        margin-top:5px;
    }

    .logo-box{
        text-align:center;
        padding:10px;
    }

    .logo-box img{
        width:80px;
        height:80px;
        object-fit:contain;
    }

    .form{
        padding:15px;
    }

    input{
        width:100%;
        padding:12px;
        margin:8px 0;
        border:1px solid #2b6cb0;
        border-radius:5px;
        outline:none;
    }

    button{
        width:100%;
        padding:12px;
        background:#2b6cb0;
        color:white;
        border:none;
        border-radius:5px;
        margin-top:10px;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:#1e4f86;
    }

    .scan{
        margin-top:10px;
        background:#e2e8f0;
        color:#000;
    }

    .tabs{
        display:flex;
        justify-content:space-between;
        margin-top:10px;
    }

    .tabs div{
        flex:1;
        padding:10px;
        text-align:center;
        background:#edf2f7;
        border:1px solid #cbd5e0;
        font-size:12px;
    }

    .partners{
        text-align:center;
        padding:10px;
        background:#f7fafc;
        margin-top:10px;
    }

    .iframe-container{
        display:none;
        width:100%;
        height:100vh;
        position:fixed;
        top:0;
        left:0;
        background:white;
    }

    iframe{
        width:100%;
        height:100%;
        border:none;
    }

    .error{
        color:red;
        font-size:12px;
        text-align:center;
    }
</style>
</head>

<body>

<div class="app" id="loginApp">

    <div class="header">
        INSECTICIDE TREATED NET MASS CAMPAIGN 2027
        <small>MINISTRY OF HEALTH - SIERRA LEONE</small>
    </div>

    <div class="logo-box">
        <img src="ICF.jpg" alt="logo">
    </div>

    <div class="form">
        <input type="text" id="username" placeholder="USERNAME">
        <input type="password" id="password" placeholder="PASSWORD">

        <button onclick="login()">LOGIN</button>

        <button class="scan">SCAN USER ID CARD</button>

        <div class="error" id="error"></div>

        <div class="tabs">
            <div>INTERNET CONNECTIVITY</div>
            <div>DEVICE TRACKING</div>
            <div>PROVISION</div>
        </div>

        <div class="partners">
            <b>IMPLEMENTING PARTNERS</b><br><br>
            GLOBAL FUND | WORLD VISION | WHO
        </div>
    </div>

</div>

<!-- iframe page -->
<div class="iframe-container" id="iframeContainer">
    <iframe id="regFrame"></iframe>
</div>

<script>
let credentials = [];

// Load CSV file
fetch("credential.csv")
.then(res => res.text())
.then(data => {
    let rows = data.split("\n");
    rows.forEach(r => {
        let cols = r.split(",");
        if(cols.length >= 2){
            credentials.push({
                username: cols[0].trim(),
                password: cols[1].trim()
            });
        }
    });
});

// LOGIN FUNCTION
function login(){
    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();
    let error = document.getElementById("error");

    let valid = credentials.find(c => c.username === user && c.password === pass);

    if(valid){
        document.getElementById("loginApp").style.display = "none";
        document.getElementById("iframeContainer").style.display = "block";
        document.getElementById("regFrame").src = "reg.html";
    }else{
        error.innerText = "Invalid username or password";
    }
}
</script>

</body>
</html>
