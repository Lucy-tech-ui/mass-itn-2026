<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Mass Campaign 2026/2027</title>

<style>

:root{
    --blue:#4FA9D9;
    --text:#1f2937;
    --border:#e5e7eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f6f8fb;
}

/* APP CONTAINER */
.app{
    max-width:430px;
    margin:auto;
    background:#fff;
    min-height:100vh;
    position:relative;
    overflow:hidden;
}

/* LEFT + RIGHT BLUE LINES */
.app::before,
.app::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:4px;
    background:var(--blue);
    z-index:0;
}

.app::before{ left:0; }
.app::after{ right:0; }

/* CONTENT ABOVE LINES */
.header, .partners, .banner, .menu, .footer{
    position:relative;
    z-index:1;
}

/* HEADER */
.header{
    width:100%;
    background:var(--blue);
    text-align:center;
    padding:18px 10px;
    color:#fff;
}

.header h1{
    font-size:18px;
    margin-bottom:10px;
}

.header img{
    width:75px;
    height:75px;
    object-fit:contain;
    display:block;
    margin:8px auto;
}

.header h2{
    font-size:13px;
    font-weight:600;
    line-height:1.4;
}

/* PARTNERS */
.partners{
    padding:12px 8px;
    background:#fff;
}

.partners-title{
    text-align:center;
    color:var(--blue);
    font-weight:700;
    font-size:13px;
    margin-bottom:10px;
}

.partner-grid{
    display:flex;
    gap:6px;
}

.partner{
    flex:1;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    text-align:center;
    padding:8px;
}

.partner img{
    width:35px;
    height:35px;
}

/* BANNER */
.banner{
    padding:10px;
    background:#fff;
}

.banner img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--border);
}

/* MENU */
.menu{
    padding:10px;
    background:#fff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
}

/* BLUE CARDS */
.card{
    background:var(--blue);
    border-radius:10px;
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:11px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
}

.card:active{
    transform:scale(.96);
}

/* FOOTER */
.footer{
    width:100%;
    background:var(--blue);
    text-align:center;
    padding:14px 10px;
    color:#fff;
    font-size:12px;
    font-weight:600;
}

/* IFRAME MODAL */
.iframe-container{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.iframe-box{
    width:95%;
    height:90%;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.iframe-header{
    background:var(--blue);
    color:#fff;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:14px;
}

.iframe-box iframe{
    width:100%;
    height:100%;
    border:none;
}

.close-btn{
    cursor:pointer;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <h1>ITN MASS CAMPAIGN 2026/2027</h1>
        <img src="MoH.png">
        <h2>MINISTRY OF HEALTH</h2>
        <h2>NATIONAL MALARIA CONTROL PROGRAMME</h2>
        <h2>SIERRA LEONE</h2>
    </div>

    <!-- PARTNERS -->
    <div class="partners">
        <div class="partners-title">IMPLEMENTING PARTNERS</div>

        <div class="partner-grid">
            <div class="partner"><img src="global.png"></div>
            <div class="partner"><img src="world.png"></div>
            <div class="partner"><img src="who.png"></div>
        </div>
    </div>

    <!-- BANNER -->
    <div class="banner">
        <img src="IMAGE.png">
    </div>

    <!-- MENU -->
    <div class="menu">

        <div class="grid">

            <div class="card" onclick="openPage('reg.html')">Registration</div>
            <div class="card">Distribution</div>
            <div class="card">Records</div>

            <div class="card">Dashboard</div>
            <div class="card">Attendance</div>
            <div class="card">Stock Mgmt</div>

            <div class="card">Reconciliation</div>
            <div class="card">Device Tracking</div>
            <div class="card">Monitoring</div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        Powered by Informatics Consultancy Firm-SL © 2026
    </div>

</div>

<!-- IFRAME MODAL -->
<div class="iframe-container" id="iframeBox">

    <div class="iframe-box">

        <div class="iframe-header">
            <span>Registration</span>
            <span class="close-btn" onclick="closeFrame()">✖</span>
        </div>

        <iframe id="frame"></iframe>

    </div>

</div>

<script>

function openPage(page){
    document.getElementById("frame").src = page;
    document.getElementById("iframeBox").style.display = "flex";
}

function closeFrame(){
    document.getElementById("iframeBox").style.display = "none";
    document.getElementById("frame").src = "";
}

</script>

</body>
</html>
