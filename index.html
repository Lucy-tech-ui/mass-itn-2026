<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Mass Campaign 2027</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f4c81,#1e88e5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header{
    text-align:center;
    padding:30px;
}

.header img{
    width:80px;
    margin-bottom:10px;
}

.header h2{
    color:#0f4c81;
    margin-bottom:8px;
}

.header h3{
    margin-bottom:8px;
}

.header h4{
    color:#555;
}

.main{
    padding:30px 20px;
}

.login-card{
    max-width:450px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-top{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    text-align:center;
    padding:25px;
}

.login-top img{
    width:90px;
}

.form-group{
    padding:12px 15px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    cursor:pointer;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.login-btn{
    background:#1565c0;
    color:white;
}

.login-btn:hover{
    background:#0d47a1;
}

.scan-btn{
    background:#26a69a;
    color:white;
    margin-top:10px;
}

.scan-btn:hover{
    background:#00897b;
}

.csv-btn{
    background:#ff9800;
    color:white;
}

.csv-btn:hover{
    background:#ef6c00;
}

.status{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

.action-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:30px;
}

.action-card{
    background:white;
    border-radius:12px;
    padding:25px;
    text-align:center;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
    transition:.3s;
}

.action-card:hover{
    transform:translateY(-5px);
}

.connectivity{
    border-top:5px solid #2196f3;
}

.tracking{
    border-top:5px solid #4caf50;
}

.provision{
    border-top:5px solid #ff9800;
}

.partners{
    padding:20px;
}

.partners-title{
    text-align:center;
    font-size:22px;
    color:#0f4c81;
    margin-bottom:20px;
    font-weight:bold;
}

.partner-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.partner{
    background:#f5f8fc;
    border-radius:10px;
    padding:20px;
    text-align:center;
    border:1px solid #ddd;
}

.partner img{
    width:70px;
    margin-bottom:10px;
}

.footer{
    text-align:center;
    background:#0f4c81;
    color:white;
    padding:15px;
    font-weight:bold;
}

@media(max-width:768px){

.action-buttons{
    grid-template-columns:1fr;
}

.partner-grid{
    grid-template-columns:1fr;
}

}
</style>

</head>
<body>

<div class="container">

    <div class="header">
        <img src="moh_logo.png" alt="MOH Logo">

        <h2>INSECTICIDE TREATED NET MASS CAMPAIGN 2027</h2>
        <h2>MINISTRY OF HEALTH</h2>
        <h3>NATIONAL MALARIA CONTROL PROGRAMME</h3>
        <h4>SIERRA LEONE</h4>
    </div>

    <div class="main">

        <div class="login-card">

            <div class="login-top">
                <img src="ICF-SL Logo.jpg" alt="ICF Logo">
            </div>

            <div class="form-group">
                <label>Select credential.csv</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>

            <div class="status" id="status">
                No credential file loaded
            </div>

            <div class="form-group">
                <input type="text" id="username" placeholder="Username">
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
            </div>

            <div class="form-group">
                <button class="btn login-btn" onclick="login()">
                    LOGIN
                </button>
            </div>

            <div class="form-group">
                <button class="btn scan-btn" onclick="scanCard()">
                    SCAN USER ID CARD
                </button>
            </div>

        </div>

        <div class="action-buttons">

            <div class="action-card connectivity"
                 onclick="showModule('Internet Connectivity')">
                INTERNET CONNECTIVITY
            </div>

            <div class="action-card tracking"
                 onclick="showModule('Attendance Tracking')">
                ATTENDANCE TRACKING
            </div>

            <div class="action-card provision"
                 onclick="showModule('Provision')">
                PROVISION
            </div>

        </div>

    </div>

    <div class="partners">

        <div class="partners-title">
            IMPLEMENTING PARTNERS
        </div>

        <div class="partner-grid">

            <div class="partner">
                <img src="global_fund.png" alt="">
                <h5>GLOBAL FUND</h5>
            </div>

            <div class="partner">
                <img src="world-vision-logo.png" alt="">
                <h5>WORLD VISION</h5>
            </div>

            <div class="partner">
                <img src="who.png" alt="">
                <h5>WORLD HEALTH ORGANIZATION</h5>
            </div>

        </div>

    </div>

    <div class="footer">
        Powered by ICF-SL © 2026
    </div>

</div>

<script>

let credentials = [];

document.getElementById("csvFile").addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const text = e.target.result;
        const rows = text.split(/\r?\n/);

        credentials = [];

        rows.forEach(row => {

            const cols = row.split(",");

            if(cols.length >= 2){

                credentials.push({
                    username: cols[0].trim(),
                    password: cols[1].trim()
                });

            }

        });

        document.getElementById("status").innerHTML =
            "✓ Credentials Loaded Successfully";

        document.getElementById("status").className =
            "status success";
    };

    reader.readAsText(file);

});

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    if(credentials.length === 0){

        alert("Please load credential.csv first.");
        return;

    }

    const user = credentials.find(u =>
        u.username === username &&
        u.password === password
    );

    if(user){

        alert("Login Successful");

    }else{

        alert("Invalid Username or Password");

    }

}

function scanCard(){
    alert("User ID Card Scanner Module");
}

function showModule(moduleName){
    alert(moduleName + " Module");
}

</script>

</body>
</html>
