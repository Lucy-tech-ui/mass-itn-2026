<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Mass Campaign 2027</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f4c81,#1e88e5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header{
    text-align:center;
    padding:30px;
    background:white;
}

.header img{
    width:80px;
    margin-bottom:10px;
}

.header h2{
    font-size:20px;
    margin-bottom:8px;
}

.header h3{
    font-size:18px;
    margin-bottom:8px;
}

.header h4{
    font-size:16px;
    color:#555;
}

.main{
    background:white;
    padding:40px 20px;
}

.login-card{
    max-width:400px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-top{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    text-align:center;
    padding:25px;
}

.login-top img{
    width:90px;
}

.form-group{
    padding:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    cursor:pointer;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.login-btn{
    background:#1565c0;
    color:white;
}

.login-btn:hover{
    background:#0d47a1;
}

.scan-btn{
    background:#26a69a;
    color:white;
    margin-top:10px;
}

.action-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:30px;
}

.action-card{
    background:white;
    border-radius:12px;
    padding:30px 15px;
    text-align:center;
    font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.partners{
    background:white;
    padding:20px;
}

.footer{
    text-align:center;
    background:#0f4c81;
    color:white;
    padding:15px;
    font-weight:bold;
}

/* iframe overlay */
#iframeBox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    display:none;
    z-index:999;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

.error{
    color:red;
    text-align:center;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container" id="loginPage">

    <div class="header">
        <img src="moh_logo.png">
        <h2>INSECTICIDE TREATED NET MASS CAMPAIGN 2027</h2>
        <h2>MINISTRY OF HEALTH</h2>
        <h3>NATIONAL MALARIA CONTROL PROGRAMME</h3>
        <h4>SIERRA LEONE</h4>
    </div>

    <div class="main">

        <div class="login-card">

            <div class="login-top">
                <img src="ICF-SL Logo.jpg">
            </div>

            <div class="form-group">
                <input type="text" id="username" placeholder="Username">
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
            </div>

            <div class="form-group">
                <button class="btn login-btn" onclick="login()">
                    LOGIN
                </button>
                <div class="error" id="error"></div>
            </div>

            <div class="form-group">
                <button class="btn scan-btn">
                    SCAN USER ID CARD
                </button>
            </div>

        </div>

    </div>

</div>

<!-- iframe page -->
<div id="iframeBox">
    <iframe id="frame"></iframe>
</div>

<script>
let credentials = [];

// Load CSV file
fetch("credential.csv")
.then(res => res.text())
.then(data => {
    let rows = data.split("\n");

    rows.forEach(row => {
        let cols = row.split(",");
        if(cols.length >= 2){
            credentials.push({
                username: cols[0].trim(),
                password: cols[1].trim()
            });
        }
    });
});

// LOGIN FUNCTION
function login(){
    let user = document.getElementById("username").value.trim();
    let pass = document.getElementById("password").value.trim();
    let error = document.getElementById("error");

    let found = credentials.find(c => c.username === user && c.password === pass);

    if(found){
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("iframeBox").style.display = "block";
        document.getElementById("frame").src = "reg.html";
    }else{
        error.innerText = "Invalid username or password";
    }
}
</script>

</body>
</html>
