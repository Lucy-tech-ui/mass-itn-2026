<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Mass Campaign 2027</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:linear-gradient(135deg,#0f4c81,#1e88e5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header{
    text-align:center;
    padding:30px;
}

.header h2{
    color:#0f4c81;
    margin-bottom:8px;
}

.header h3{
    color:#333;
}

.main{
    padding:40px 20px;
}

.login-card{
    max-width:400px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-top{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    text-align:center;
    padding:25px;
}

.login-top img{
    width:90px;
}

.form-group{
    padding:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    cursor:pointer;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
}

.login-btn{
    background:#1565c0;
    color:white;
}

.login-btn:hover{
    background:#0d47a1;
}

#iframeContainer{
    display:none;
    width:100%;
    padding:20px;
}

iframe{
    width:100%;
    height:700px;
    border:none;
    border-radius:10px;
}

.error{
    color:red;
    text-align:center;
    margin-top:10px;
}
</style>

</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h2>INSECTICIDE TREATED NET MASS CAMPAIGN 2027</h2>
        <h3>MINISTRY OF HEALTH - SIERRA LEONE</h3>
    </div>

    <!-- LOGIN SECTION -->
    <div class="main" id="loginSection">

        <div class="login-card">

            <div class="login-top">
                <img src="ICF-SL Logo.png" alt="logo">
            </div>

            <div class="form-group">
                <input type="text" id="username" placeholder="Username">
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
            </div>

            <div class="form-group">
                <button class="btn login-btn" onclick="loginUser()">LOGIN</button>
            </div>

            <div class="error" id="errorMsg"></div>

        </div>

    </div>

    <!-- IFRAME SECTION -->
    <div id="iframeContainer">
        <iframe id="contentFrame"></iframe>
    </div>

</div>

<script>

async function loginUser(){

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.innerText = "";

    if(!username || !password){
        errorMsg.innerText = "Please enter username and password";
        return;
    }

    try{

        const response = await fetch("credential.csv");
        const csvData = await response.text();

        const rows = csvData.split("\n");

        let isValid = false;

        for(let i = 1; i < rows.length; i++){

            const cols = rows[i].split(",");

            if(cols.length >= 2){

                const csvUser = cols[0].trim();
                const csvPass = cols[1].trim();

                if(username === csvUser && password === csvPass){
                    isValid = true;
                    break;
                }
            }
        }

        if(isValid){

            // Hide login
            document.getElementById("loginSection").style.display = "none";

            // Show iframe
            document.getElementById("iframeContainer").style.display = "block";

            // Load reg.html inside iframe
            document.getElementById("contentFrame").src = "reg.html";

        } else {
            errorMsg.innerText = "Invalid username or password";
        }

    } catch(error){
        console.error(error);
        errorMsg.innerText = "Cannot load credential.csv (use Live Server)";
    }

}

</script>

</body>
</html>
