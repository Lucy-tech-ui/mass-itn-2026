<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Mass Campaign 2027</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f4c81,#1e88e5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header{
    text-align:center;
    padding:30px 20px;
}

.main-logo{
    width:80px;
    margin-bottom:10px;
}

.header h2{
    color:#0f4c81;
    margin-bottom:8px;
    font-size:22px;
}

.header h3{
    margin-bottom:8px;
    font-size:18px;
}

.header h4{
    color:#666;
}

.header-partners{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #ddd;
}

.partner-item{
    text-align:center;
}

.partner-item img{
    width:60px;
}

.partner-item span{
    display:block;
    margin-top:5px;
    font-size:12px;
    font-weight:bold;
    color:#0f4c81;
}

.main{
    padding:40px 20px;
}

.login-card{
    max-width:400px;
    margin:auto;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-top{
    background:linear-gradient(135deg,#1976d2,#42a5f5);
    text-align:center;
    padding:25px;
}

.login-top img{
    width:90px;
}

.form-group{
    padding:15px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn{
    background:#1565c0;
    color:#fff;
}

.scan-btn{
    background:#26a69a;
    color:#fff;
    margin-top:10px;
}

.message{
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.footer{
    text-align:center;
    background:#0f4c81;
    color:white;
    padding:15px;
    font-weight:bold;
}

@media(max-width:768px){

    .header h2{
        font-size:18px;
    }

    .header h3{
        font-size:15px;
    }

    .partner-item img{
        width:45px;
    }

    .partner-item span{
        font-size:10px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">

        <img src="moh_logo.png" class="main-logo" alt="MOH Logo">

        <h2>INSECTICIDE TREATED NET MASS CAMPAIGN 2027</h2>
        <h2>MINISTRY OF HEALTH</h2>
        <h3>NATIONAL MALARIA CONTROL PROGRAMME</h3>
        <h4>SIERRA LEONE</h4>

        <div class="header-partners">

            <div class="partner-item">
                <img src="global_fund.png" alt="">
                <span>GLOBAL FUND</span>
            </div>

            <div class="partner-item">
                <img src="world-vision-logo.png" alt="">
                <span>WORLD VISION</span>
            </div>

            <div class="partner-item">
                <img src="who.png" alt="">
                <span>WHO</span>
            </div>

            <div class="partner-item">
                <img src="USAID-Past.png" alt="">
                <span>ICF-SL</span>
            </div>

        </div>

    </div>

    <div class="main">

        <div class="login-card">

            <div class="login-top">
                <img src="ICF-SL Logo.jpg" alt="ICF Logo">
            </div>

            <div class="form-group">
                <input type="text" id="username" placeholder="Username">
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
            </div>

            <div class="form-group">
                <button class="btn login-btn" onclick="login()">
                    LOGIN
                </button>
            </div>

            <div class="form-group">
                <button class="btn scan-btn">
                    SCAN USER ID CARD
                </button>
            </div>

            <div id="message" class="message"></div>

        </div>

    </div>

    <div class="footer">
        Powered by ICF-SL @ 2026
    </div>

</div>

<script>
async function login(){

    const username =
        document.getElementById('username').value.trim();

    const password =
        document.getElementById('password').value.trim();

    const msg =
        document.getElementById('message');

    try{

        const response =
            await fetch('credential.csv');

        const csv =
            await response.text();

        const rows =
            csv.split('\n');

        let valid = false;

        for(let i=1;i<rows.length;i++){

            const cols =
                rows[i].trim().split(',');

            if(cols.length >= 2){

                const csvUser = cols[0].trim();
                const csvPass = cols[1].trim();

                if(
                    username === csvUser &&
                    password === csvPass
                ){
                    valid = true;
                    break;
                }
            }
        }

        if(valid){
            msg.style.color = "green";
            msg.innerHTML = "Login Successful";
        }else{
            msg.style.color = "red";
            msg.innerHTML = "Invalid Username or Password";
        }

    }catch(error){

        msg.style.color = "red";
        msg.innerHTML =
            "Unable to read credential.csv. Run from a web server.";
    }
}
</script>

</body>
</html>
