<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITN Mass Campaign - Tabs Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: #f4f6f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background-color: #ffffff;
            border-radius: 44px;
            box-shadow: 0 20px 50px rgba(0, 32, 16, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 8px solid #333;
        }

        .app-header {
            background-color: #ffffff;
            padding: 48px 24px 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            border-bottom: 1px solid #eaeaea;
        }

        .moh-title-container { display: flex; align-items: center; gap: 16px; }
        .moh-seal-top { width: 52px; height: 52px; background: white; border-radius: 50%; padding: 2px; object-fit: contain; }
        .moh-text h1 { font-size: 16px; font-weight: 700; color: #11452a; }
        .moh-text p { font-size: 10px; font-weight: 500; color: #555555; line-height: 1.4; margin-top: 3px; }

        .partners-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .partners-label { font-size: 10px; font-weight: 800; color: #c78b16; letter-spacing: 1px; text-transform: uppercase; padding-left: 4px; }
        .partner-logos { display: flex; align-items: center; justify-content: center; gap: 20px; background: #f1f5f2; padding: 12px 16px; border-radius: 14px; }
        .partner-logo { width: 40px; height: 40px; background-color: white; border-radius: 8px; padding: 4px; object-fit: contain; border: 1px solid #e0e0e0; }

        .app-main { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; }
        
        /* Placeholder for image.png slider */
        .slider-placeholder {
            width: 100%;
            height: 140px;
            background-color: #e2e8f0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #64748b;
            font-weight: 600;
            font-size: 14px;
            border: 2px dashed #cbd5e1;
        }

        .menu-title { color: #1a1a1a; font-size: 20px; font-weight: 600; margin-bottom: 20px; }

        .tabs-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
        }

        .tab-btn {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .tab-btn:hover { border-color: #2b8146; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(43, 129, 70, 0.08); }
        .tab-btn i { color: #2b8146; font-size: 20px; }
        .tab-label { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.1; }

        .app-footer { background-color: #11452a; color: white; text-align: center; padding: 20px; font-size: 12px; margin-top: auto; }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="app-header">
            <div class="moh-title-container">
                <img src="moh_logo.png" alt="MoH Seal" class="moh-seal-top" onerror="this.src='https://via.placeholder.com/52?text=MoH'">
                <div class="moh-text">
                    <h1>MINISTRY OF HEALTH</h1>
                    <p>NATIONAL MALARIA CONTROL PROGRAMME<br>• SIERRA LEONE</p>
                </div>
            </div>
            
            <div class="partners-wrapper">
                <span class="partners-label">Implementing Partners</span>
                <div class="partner-logos">
                    <img src="who_logo.png" alt="WHO" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=WHO'">
                    <img src="world-vision-logo.png" alt="World Vision" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=WV'">
                    <img src="global_fund.png" alt="Global Fund" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=GF'">
                    <img src="NMCP.png" alt="NMCP" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=NMCP'">
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="slider-placeholder">zero.jpg.jpg</div>

            <h2 class="menu-title">Campaign Modules</h2>
            
            <div class="tabs-grid">
                <a href="#registration" class="tab-btn"><i class="fa-solid fa-user-plus"></i><span class="tab-label">Registration</span></a>
                <a href="#distribution" class="tab-btn"><i class="fa-solid fa-hand-holding-heart"></i><span class="tab-label">Distribution</span></a>
                <a href="#dashboard" class="tab-btn"><i class="fa-solid fa-chart-pie"></i><span class="tab-label">Dashboard</span></a>
                <a href="#stock" class="tab-btn"><i class="fa-solid fa-boxes-stacked"></i><span class="tab-label">Stock Mgmt</span></a>
                <a href="#monitoring" class="tab-btn"><i class="fa-solid fa-square-poll-horizontal"></i><span class="tab-label">Monitoring</span></a>
                <a href="#tracking" class="tab-btn"><i class="fa-solid fa-mobile-screen-button"></i><span class="tab-label">Device Tracking</span></a>
                <a href="#attendance" class="tab-btn"><i class="fa-solid fa-clipboard-user"></i><span class="tab-label">Attendance</span></a>
                <a href="#id-card" class="tab-btn"><i class="fa-solid fa-id-card"></i><span class="tab-label">ID Card</span></a>
                <a href="#reconciliation" class="tab-btn"><i class="fa-solid fa-code-compare"></i><span class="tab-label">Reconciliation</span></a>
            </div>
        </main>

        <footer class="app-footer">Powered by ICF-SL @ 2026</footer>
    </div>
</body>
</html>
