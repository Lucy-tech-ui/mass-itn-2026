<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITN Mass Campaign - Registration Form</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Mobile Phone Container with Background Graphic */
        .phone-container {
            width: 375px;
            height: 812px;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 44px;
            box-shadow: 0 20px 50px rgba(0, 32, 16, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 8px solid #333;
        }

        /* Top Header Area */
        .app-header {
            background-color: #11452a;
            padding: 48px 24px 20px 24px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex-shrink: 0;
        }

        .moh-title-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .moh-seal-top {
            width: 52px;
            height: 52px;
            background: white;
            border-radius: 50%;
            padding: 2px;
            object-fit: contain;
        }

        .moh-text {
            display: flex;
            flex-direction: column;
        }

        .moh-text h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .moh-text p {
            font-size: 10px;
            font-weight: 400;
            color: #d1e3d8;
            line-height: 1.4;
            margin-top: 3px;
        }

        /* Partners Container */
        .partners-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .partners-label {
            font-size: 9px;
            font-weight: 800;
            color: #f5bc4e;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding-left: 4px;
        }

        /* Partner Logos Row */
        .partner-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 14px;
        }

        .partner-logo {
            width: 44px;
            height: 44px;
            background-color: white;
            border-radius: 8px;
            padding: 4px;
            object-fit: contain;
        }

        /* Main Workspace Scroll Area */
        .app-main {
            flex-grow: 1;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .form-nav-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            color: #1a1a1a;
            font-size: 18px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.8);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .menu-title {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6); 
        }

        /* Step Progress Container with Dynamic Connector Line */
        .step-indicator-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        /* Gray Base Connector Line */
        .step-connector-line {
            position: absolute;
            top: 50%;
            left: 24px;
            right: 24px;
            height: 3px;
            background-color: #e0e0e0;
            transform: translateY(-50%);
            z-index: 1;
        }

        /* Colored Active Progress Line overlay */
        .step-connector-progress {
            position: absolute;
            top: 50%;
            left: 24px;
            height: 3px;
            background-color: #2b8146;
            transform: translateY(-50%);
            z-index: 1;
            width: 0%; 
            transition: width 0.3s ease;
        }

        .step-dot {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 3;
            transition: all 0.3s ease;
            border: 2px solid white;
        }

        .step-dot.active {
            background-color: #2b8146;
            color: white;
            box-shadow: 0 0 0 3px rgba(43, 129, 70, 0.2);
            font-weight: 800;
        }

        .step-dot.completed {
            background-color: #11452a;
            color: white;
        }

        /* Error Banner Container */
        .error-banner {
            display: none;
            background-color: #fce8e6;
            border: 1px solid #ea4335;
            color: #c5221f;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        /* Card Section Panels */
        .reg-section-panel {
            display: none;
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e1e8e4;
            animation: fadeIn 0.3s ease-in-out;
        }

        .reg-section-panel.active-panel {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            margin-bottom: 18px;
            border-bottom: 2px solid #2b8146;
            padding-bottom: 6px;
        }

        .panel-header span {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            color: #2b8146;
            letter-spacing: 0.5px;
        }

        .panel-header h3 {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 700;
            margin-top: 2px;
        }

        /* Input Component Layouts */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .input-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            background: white;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: #2b8146;
        }

        .input-control[readonly] {
            background-color: #f5f5f5;
            color: #666;
            cursor: not-allowed;
            border-color: #ddd;
        }

        /* Members Column/Grid Rows Dynamic styling */
        .member-entry-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
            background: rgba(0, 0, 0, 0.02);
            padding: 6px;
            border-radius: 6px;
            border-left: 3px solid #2b8146;
        }
        
        .member-entry-row input, .member-entry-row select {
            padding: 8px;
            font-size: 12px;
        }

        .remove-member-btn {
            background: none;
            border: none;
            color: #ea4335;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
        }

        .action-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .action-inline-btn {
            background-color: #11452a;
            color: white;
            border: none;
            padding: 0 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-mini-add {
            background-color: #2b8146;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* Navigation Action Footer Rows */
        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-primary {
            background-color: #2b8146;
            color: white;
        }

        .btn-primary:hover {
            background-color: #216a38;
        }

        /* App Footer Baseline Verification */
        .app-footer {
            background-color: #11452a;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-top: auto;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- App Header -->
        <header class="app-header">
            <div class="moh-title-container">
                <img src="moh_logo.png" alt="MoH Seal" class="moh-seal-top" onerror="this.src='https://via.placeholder.com/52?text=MoH'">
                <div class="moh-text">
                    <h1>MINISTRY OF HEALTH</h1>
                    <p>NATIONAL MALARIA CONTROL PROGRAMME<br>• SIERRA LEONE</p>
                </div>
            </div>
            
            <!-- Partners Section Wrapper -->
            <div class="partners-wrapper">
                <span class="partners-label">Implementing Partners</span>
                <div class="partner-logos">
                    <img src="who_logo.png" alt="WHO" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=WHO'">
                    <img src="world-vision-logo.png" alt="World Vision" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=WV'">
                    <img src="global_fund.png" alt="Global Fund" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=GF'">
                    <img src="NMCP.png" alt="NMCP" class="partner-logo" onerror="this.src='https://via.placeholder.com/48?text=NMCP'">
                </div>
            </div>
        </header>

        <!-- App Main Content Workspace -->
        <main class="app-main">
            
            <div class="form-nav-bar">
                <a href="tabs.html" class="back-btn" title="Back to Menu"><i class="fa-solid fa-arrow-left"></i></a>
                <h2 class="menu-title">Registration</h2>
            </div>

            <!-- Steps Progress Array Matrix with Connecting Line Layout -->
            <div class="step-indicator-wrapper">
                <div class="step-connector-line"></div>
                <div class="step-connector-progress" id="progressLine"></div>
                <div class="step-indicator">
                    <div class="step-dot active" id="dot-1">A</div>
                    <div class="step-dot" id="dot-2">B</div>
                    <div class="step-dot" id="dot-3">C</div>
                    <div class="step-dot" id="dot-4">D</div>
                    <div class="step-dot" id="dot-5">E</div>
                </div>
            </div>

            <!-- Error Banner Container -->
            <div class="error-banner" id="errorBanner"></div>

            <!-- Registration Master Form Wrapper Container -->
            <form id="registrationForm" onsubmit="event.preventDefault();">

                <!-- SECTION A: HHR INFORMATION -->
                <div class="reg-section-panel active-panel" id="panel-1">
                    <div class="panel-header">
                        <span>Section A</span>
                        <h3>HHR Information</h3>
                    </div>
                    <div class="form-group">
                        <label for="nameHHR">Name of HHR</label>
                        <input type="text" id="nameHHR" class="input-control" placeholder="Enter HHR Full Name" required>
                    </div>
                    <div class="form-group">
                        <label for="idHHR">ID Number of HHR</label>
                        <input type="text" id="idHHR" class="input-control" placeholder="Enter ID Document Number" required>
                    </div>
                    <div class="form-group">
                        <label for="dateReg">Date of Registration</label>
                        <input type="date" id="dateReg" class="input-control" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="timeReg">Registration Time (Auto)</label>
                        <input type="time" id="timeReg" class="input-control" readonly required>
                    </div>
                    <div class="button-row">
                        <button type="button" class="btn btn-primary" onclick="validateAndGo(1, 2)">Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- SECTION B: CASCADING INFORMATION (SIERRA LEONE ALL 16 DISTRICTS) -->
                <div class="reg-section-panel" id="panel-2">
                    <div class="panel-header">
                        <span>Section B</span>
                        <h3>Cascading Information</h3>
                    </div>
                    <div class="form-group">
                        <label for="district">District</label>
                        <select id="district" class="input-control" onchange="handleDistrictChange()" required>
                            <option value="">Select District</option>
                            <!-- Northern Province -->
                            <option value="Bombali">Bombali</option>
                            <option value="Falaba">Falaba</option>
                            <option value="Koinadugu">Koinadugu</option>
                            <option value="Tonkolili">Tonkolili</option>
                            <!-- North West Province -->
                            <option value="Kambia">Kambia</option>
                            <option value="Karene">Karene</option>
                            <option value="Port Loko">Port Loko</option>
                            <!-- Eastern Province -->
                            <option value="Kailahun">Kailahun</option>
                            <option value="Kenema">Kenema</option>
                            <option value="Kono">Kono</option>
                            <!-- Southern Province -->
                            <option value="Bo">Bo</option>
                            <option value="Bonthe">Bonthe</option>
                            <option value="Moyamba">Moyamba</option>
                            <option value="Pujehun">Pujehun</option>
                            <!-- Western Area -->
                            <option value="Western Area Rural">Western Area Rural</option>
                            <option value="Western Area Urban">Western Area Urban</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="region">Region</label>
                        <input type="text" id="region" class="input-control" placeholder="Auto-populated Region" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="chiefdom">Chiefdom/Zone</label>
                        <select id="chiefdom" class="input-control" onchange="handleChiefdomChange()" required disabled>
                            <option value="">Select Chiefdom/Zone</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phus">PHUs (Peripheral Health Units)</label>
                        <select id="phus" class="input-control" onchange="handlePhuChange()" required disabled>
                            <option value="">Select PHU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="village">Community/Village</label>
                        <select id="village" class="input-control" required disabled>
                            <option value="">Select Community/Village</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gps">GPS Coordinates</label>
                        <div class="action-input-wrapper">
                            <input type="text" id="gps" class="input-control" placeholder="Click FIX..." readonly required>
                            <button type="button" class="action-inline-btn" onclick="captureGPS()"><i class="fa-solid fa-location-crosshairs"></i> FIX</button>
                        </div>
                    </div>
                    <div class="button-row">
                        <button type="button" class="btn btn-secondary" onclick="navigateToStep(1)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <button type="button" class="btn btn-primary" onclick="validateAndGo(2, 3)">Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- SECTION C: HOUSEHOLD DETAILS -->
                <div class="reg-section-panel" id="panel-3">
                    <div class="panel-header">
                        <span>Section C</span>
                        <h3>Household Details</h3>
                    </div>
                    <div class="form-group">
                        <label for="headName">Name of Household Head</label>
                        <input type="text" id="headName" class="input-control" placeholder="Enter Head of Household Name" required>
                    </div>
                    <div class="form-group">
                        <label for="sex">Sex</label>
                        <select id="sex" class="input-control" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" class="input-control" placeholder="e.g. 077123456" pattern="0[0-9]{8}" title="Must start with 0 and contain exactly 9 digits." required>
                    </div>
                    <div class="form-group">
                        <label for="occupation">Occupation</label>
                        <input type="text" id="occupation" class="input-control" placeholder="Enter Occupation" required>
                    </div>
                    <div class="form-group">
                        <label for="landmark">Landmark</label>
                        <input type="text" id="landmark" class="input-control" placeholder="Nearby structures" required>
                    </div>
                    <div class="button-row">
                        <button type="button" class="btn btn-secondary" onclick="navigateToStep(2)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <button type="button" class="btn btn-primary" onclick="validateAndGo(3, 4)">Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- SECTION D: HOUSEHOLD COMPOSITION -->
                <div class="reg-section-panel" id="panel-4">
                    <div class="panel-header">
                        <span>Section D</span>
                        <h3>Household Composition</h3>
                    </div>
                    <div class="form-group">
                        <label for="totalMembers">Total Household Members</label>
                        <input type="number" id="totalMembers" class="input-control" min="1" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="childrenUnder5">Children Below the Age of 5</label>
                        <input type="number" id="childrenUnder5" class="input-control" min="0" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label for="pregnantWomen">Number of Pregnant Women</label>
                        <input type="number" id="pregnantWomen" class="input-control" min="0" placeholder="0" required>
                    </div>

                    <!-- HOUSEHOLD MEMBERS ITEMIZATION COLUMN -->
                    <div class="form-group" style="margin-top: 20px; border-top: 1px dashed #ccc; padding-top: 12px;">
                        <label style="display: flex; justify-content: space-between; align-items: center;">
                            <span>Household Members Registry</span>
                            <button type="button" class="btn-mini-add" onclick="addMemberRow()"><i class="fa-solid fa-plus"></i> Add Row</button>
                        </label>
                        <div id="membersContainer" style="margin-top: 8px;">
                            <!-- Dynamic Member Entry Rows Append Here -->
                        </div>
                    </div>

                    <div class="button-row">
                        <button type="button" class="btn btn-secondary" onclick="navigateToStep(3)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <button type="button" class="btn btn-primary" onclick="validateAndGo(4, 5)">Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- SECTION E: NET ALLOCATION -->
                <div class="reg-section-panel" id="panel-5">
                    <div class="panel-header">
                        <span>Section E</span>
                        <h3>Net Allocation</h3>
                    </div>
                    <div class="form-group">
                        <label for="hhSizeSize">Household Size Summary</label>
                        <input type="text" id="hhSizeSize" class="input-control" placeholder="Calculated metrics" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="itnEligibility">Eligibility of Total ITNs per Household</label>
                        <input type="text" id="itnEligibility" class="input-control" placeholder="Calculated ITN allocation" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="distPoint">Distribution Point Assigned</label>
                        <select id="distPoint" class="input-control" required>
                            <option value="">Select Assignation Post</option>
                            <option value="hub_a">Distribution Center Alpha</option>
                            <option value="hub_b">Distribution Center Beta</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="margin-top: 20px;">
                        <label>Verification Token</label>
                        <div class="action-input-wrapper">
                            <input type="text" id="tokenField" class="input-control" placeholder="Click generate..." readonly required>
                            <button type="button" class="action-inline-btn" onclick="generateToken()"><i class="fa-solid fa-ticket"></i> Generate</button>
                        </div>
                    </div>

                    <div class="button-row">
                        <button type="button" class="btn btn-secondary" onclick="navigateToStep(4)"><i class="fa-solid fa-arrow-left"></i> Back</button>
                        <button type="button" class="btn btn-primary" style="background-color:#11452a;" onclick="submitRegistrationForm()">SUBMIT DATA</button>
                    </div>
                </div>

            </form>
        </main>

        <!-- App Footer Baseline Verification -->
        <footer class="app-footer">
            Powered by ICF-SL @ 2026
        </footer>
    </div>

    <!-- Complete Cascading Database Logic Framework Script -->
    <script>
        // Global variables for timestamp engine control
        let timeTrackerInterval;
        let activeStep = 1;

        // Real Provincial & Regional Mappings across Sierra Leone
        const districtRegionMap = {
            "Bombali": "Northern", "Falaba": "Northern", "Koinadugu": "Northern", "Tonkolili": "Northern",
            "Kambia": "North West", "Karene": "North West", "Port Loko": "North West",
            "Kailahun": "Eastern", "Kenema": "Eastern", "Kono": "Eastern",
            "Bo": "Southern", "Bonthe": "Southern", "Moyamba": "Southern", "Pujehun": "Southern",
            "Western Area Rural": "Western Area", "Western Area Urban": "Western Area"
        };

        // Complete Chiefdom Database Lookup Map For All 16 Districts
        const chiefdomDataLookup = {
            "Bombali": ["Makari Gbanti", "Paki Masabong", "Gbanti Kamaranka", "Magbaimba Ndowahun"],
            "Falaba": ["Sulima Chiefdom", "Mongo Chiefdom", "Neya Chiefdom", "Dembelia Chiefdom"],
            "Koinadugu": ["Kasunko", "Wara Wara Yagala", "Sengbe", "Mongo"],
            "Tonkolili": ["Yoni Chiefdom", "Kholifa Pamumpo", "Gbonkolenken", "Malal Chiefdom"],
            "Kambia": ["Magbema", "Mambolo", "Masungbala", "Gbinle Dixing"],
            "Karene": ["Kamalu Zone", "Sanda Loko", "Buya Romende", "Libeisaygahun"],
            "Port Loko": ["Maforki", "Koya Chiefdom", "Bureh Kasseh", "Dibia"],
            "Kailahun": ["Luawa", "Kissi Teng", "Mandu Chiefdom", "Upper Bambara"],
            "Kenema": ["Nogowa", "Largo Zone", "Small Bo", "Kandu Leppiama"],
            "Kono": ["Nimiyama", "Gbense", "Tankoro", "Fiama Chiefdom"],
            "Bo": ["Kakua", "Tikonko", "Lugbu", "Bagbo Chiefdom"],
            "Bonthe": ["Imperi", "Sittia", "Yawbeko", "Dema Chiefdom"],
            "Moyamba": ["Kaiyamba", "Kori Chiefdom", "Banta Chiefdom", "Ribbi"],
            "Pujehun": ["Kpanga Kabonde", "Barri Chiefdom", "Soro Gbema", "Makpele"],
            "Western Area Rural": ["Koya Rural Zone", "Waterloo Zone", "Benguema District Area", "Tombo Village Area"],
            "Western Area Urban": ["Central West Ward", "East Ward I", "East Ward II", "East Ward III", "West Ward I", "West Ward II"]
        };

        // Real Contextual PHUs Matched to Sample Chiefdom Fields
        const phuDataLookup = {
            "Makari Gbanti": ["Masuba CHP", "Bombali Bana MCHP", "Makeni Government Hospital Annex"],
            "Kakua": ["Bo Government Hospital Clinic", "Bo Town CHC", "Ngalu Road CHP"],
            "Waterloo Zone": ["Waterloo CHC", "Lumpa MCHP", "Cole Town CHP"],
            "Central West Ward": ["Connaught Hospital OPD", "Macauley Street Government Hospital", "Kroo Bay CHC"],
            "Luawa": ["Kailahun CHC", "Kuiva MCHP", "Pendembu CHC"],
            "Nogowa": ["Kenema Government Hospital Annex", "Blama CHC", "Kambema CHP"],
            "Maforki": ["Port Loko Government Clinic", "Sendugu MCHP", "Cherekhu CHP"],
            "Magbema": ["Kambia Government Hospital Clinic", "Rokupr CHC", "Gbalamuya Border Post CHP"]
        };

        // Contextual Village Communities Dynamic Mapper
        const villageDataLookup = {
            "Masuba CHP": ["Masuba Village", "Rokupr Road Quarter", "Mena Hills Area"],
            "Bo Town CHC": ["Kakua Settlement", "Tikonko Line East", "Kandeh Town Community"],
            "Waterloo CHC": ["Waterloo Proper", "Bassa Town Block", "New Camp Section"],
            "Connaught Hospital OPD": ["Tower Hill Quarter", "Brookfields Community", "Central Ward 2 Block"],
            "Kailahun CHC": ["Luawa Compound", "Textile Ground Settlement", "Moa River Bank Corner"]
        };

        // Clock loop to dynamically auto-generate real-time metrics
        function startLiveClock() {
            if (timeTrackerInterval) clearInterval(timeTrackerInterval);
            
            timeTrackerInterval = setInterval(() => {
                if (activeStep === 1) {
                    const now = new Date();
                    
                    // Generate local system tracking metrics
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    
                    document.getElementById('dateReg').value = `${year}-${month}-${day}`;
                    document.getElementById('timeReg').value = `${hours}:${minutes}`;
                }
            }, 1000);
        }

        // Cascade handler logic loops
        function handleDistrictChange() {
            const district = document.getElementById('district').value;
            const regionEl = document.getElementById('region');
            const chiefdomEl = document.getElementById('chiefdom');
            
            regionEl.value = districtRegionMap[district] || "";
            chiefdomEl.innerHTML = '<option value="">Select Chiefdom/Zone</option>';
            
            if (district && chiefdomDataLookup[district]) {
                chiefdomDataLookup[district].forEach(c => {
                    chiefdomEl.innerHTML += `<option value="${c}">${c}</option>`;
                });
                chiefdomEl.disabled = false;
            } else {
                chiefdomEl.disabled = true;
            }
            clearDropdown('phus');
            clearDropdown('village');
        }

        function handleChiefdomChange() {
            const chiefdom = document.getElementById('chiefdom').value;
            const phusEl = document.getElementById('phus');
            phusEl.innerHTML = '<option value="">Select PHU</option>';

            const dataset = phuDataLookup[chiefdom] || [`${chiefdom} Peripheral Health Unit`, `${chiefdom} Community Health Post`];
            
            dataset.forEach(p => {
                phusEl.innerHTML += `<option value="${p}">${p}</option>`;
            });
            phusEl.disabled = false;
            clearDropdown('village');
        }

        function handlePhuChange() {
            const phu = document.getElementById('phus').value;
            const villageEl = document.getElementById('village');
            villageEl.innerHTML = '<option value="">Select Community/Village</option>';

            const dataset = villageDataLookup[phu] || [`${phu.split(' ')[0]} Central Village`, `${phu.split(' ')[0]} Settlement Area B`];
            
            dataset.forEach(v => {
                villageEl.innerHTML += `<option value="${v}">${v}</option>`;
            });
            villageEl.disabled = false;
        }

        function clearDropdown(id) {
            const el = document.getElementById(id);
            el.innerHTML = `<option value="">Select ${id === 'phus' ? 'PHU' : 'Community/Village'}</option>`;
            el.disabled = true;
        }

        // Dynamic Household Member Row Management 
        function addMemberRow() {
            const container = document.getElementById('membersContainer');
            const row = document.createElement('div');
            row.className = 'member-entry-row';
            row.innerHTML = `
                <input type="text" class="input-control member-name" placeholder="Name" required style="flex:2;">
                <input type="number" class="input-control member-age" placeholder="Age" min="0" required style="flex:1;">
                <select class="input-control member-gender" required style="flex:1.2;">
                    <option value="">Sex</option>
                    <option value="M">M</option>
                    <option value="F">F</option>
                </select>
                <button type="button" class="remove-member-btn" onclick="this.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(row);
        }

        // Form navigation wizard routing management with Connector Line Width Sync
        function navigateToStep(stepNumber) {
            activeStep = stepNumber;
            document.getElementById('errorBanner').style.display = 'none';
            document.querySelectorAll('.reg-section-panel').forEach(panel => {
                panel.classList.remove('active-panel');
            });
            document.getElementById('panel-' + stepNumber).classList.add('active-panel');
            
            // Render Dynamic Connector Line Width Percentages
            const progressWidths = { 1: 0, 2: 25, 3: 50, 4: 75, 5: 100 };
            document.getElementById('progressLine').style.width = progressWidths[stepNumber] + "%";

            for (let i = 1; i <= 5; i++) {
                let dot = document.getElementById('dot-' + i);
                if (i < stepNumber) dot.className = 'step-dot completed';
                else if (i === stepNumber) dot.className = 'step-dot active';
                else dot.className = 'step-dot';
            }

            if (stepNumber === 5) {
                calculateAllocation();
            }
        }

        // Field constraints and execution validation logic
        function validateAndGo(currentStep, nextStep) {
            const currentPanel = document.getElementById('panel-' + currentStep);
            const errorBanner = document.getElementById('errorBanner');
            errorBanner.style.display = 'none';

            const inputs = currentPanel.querySelectorAll('input[required], select[required]');
            for (let input of inputs) {
                if (!input.value.trim()) {
                    errorBanner.innerText = "Error: All operational variables in this section are mandatory.";
                    errorBanner.style.display = 'block';
                    return;
                }
                if (input.pattern && !new RegExp(input.pattern).test(input.value)) {
                    errorBanner.innerText = "Error: Invalid input payload format. Check phone parameters.";
                    errorBanner.style.display = 'block';
                    return;
                }
            }

            // SECTION D VALIDATION
            if (currentStep === 4) {
                const total = parseInt(document.getElementById('totalMembers').value) || 0;
                const under5 = parseInt(document.getElementById('childrenUnder5').value) || 0;
                const pregnant = parseInt(document.getElementById('pregnantWomen').value) || 0;
                const rowCount = document.querySelectorAll('.member-entry-row').length;

                if ((under5 + pregnant) > total) {
                    errorBanner.innerText = `Validation Error: Total Household Members (${total}) cannot be less than the combined specific categories (Children Under-5: ${under5} + Pregnant Women: ${pregnant} = ${under5 + pregnant}).`;
                    errorBanner.style.display = 'block';
                    return;
                }

                if (rowCount > total) {
                    errorBanner.innerText = `Validation Error: The structural Household Members Registry rows (${rowCount}) listed exceeds the stated Total Household Members limit (${total}).`;
                    errorBanner.style.display = 'block';
                    return;
                }
            }

            navigateToStep(nextStep);
        }

        function captureGPS() {
            document.getElementById('gps').value = "8.4873° N, 13.2355° W";
        }

        function calculateAllocation() {
            const total = parseInt(document.getElementById('totalMembers').value) || 0;
            document.getElementById('hhSizeSize').value = total + " Members Confirmed";
            const calculatedNets = Math.ceil(total / 2);
            document.getElementById('itnEligibility').value = calculatedNets + " Bed Nets (ITNs)";
        }

        // Dynamic token formula engine mapping: First Name (3 chars) + Community + Phone Number
        function generateToken() {
            const errorBanner = document.getElementById('errorBanner');
            errorBanner.style.display = 'none';

            const headNameInput = document.getElementById('headName').value.trim();
            const communitySelect = document.getElementById('village').value;
            const phoneInput = document.getElementById('phone').value.trim();

            if (!headNameInput || !communitySelect || !phoneInput) {
                errorBanner.innerText = "Generation Error: You must fill out the Household Head Name, Community, and Phone fields on previous steps before generating a verification token.";
                errorBanner.style.display = 'block';
                return;
            }

            const firstName = headNameInput.split(' ')[0];
            const dynamicNamePart = firstName.substring(0, 3).toUpperCase().padEnd(3, 'X');
            const dynamicCommPart = communitySelect.replace(/[^a-zA-Z0-9]/g, '').substring(0, 4).toUpperCase();
            const builtToken = `${dynamicNamePart}-${dynamicCommPart}-${phoneInput}`;
            
            document.getElementById('tokenField').value = builtToken;
        }

        function submitRegistrationForm() {
            const tokenField = document.getElementById('tokenField').value;
            if(!document.getElementById('distPoint').value || !tokenField) {
                const errorBanner = document.getElementById('errorBanner');
                errorBanner.innerText = "Error: Please choose a valid assignment center and generate your token key.";
                errorBanner.style.display = 'block';
                return;
            }
            alert("Success! Record securely synced to central NMCP storage registry.\nGenerated Token ID: " + tokenField);
            window.location.href = 'tabs.html';
        }

        window.addEventListener('load', () => {
            // Initiate the automated live clock tracking module instantly
            startLiveClock();
            
            // Instantiate one baseline table row entry automatically
            addMemberRow();
        });
    </script>
</body>
