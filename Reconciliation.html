<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITN Reconciliation Portal | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9f9fb; }
        .sidebar { background: #ffffff; border-right: 1px solid #e5e7eb; }
        .nav-item { padding: 12px 20px; font-weight: 600; color: #4b5563; cursor: pointer; transition: 0.2s; }
        .nav-active { background: #11452a; color: white; border-radius: 8px; margin: 0 10px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn-primary { background: #11452a; color: white; }
        .btn-secondary { background: #c78b16; color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white border-b px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4 text-[#11452a]">
            <div class="w-10 h-10 bg-[#11452a] text-white flex items-center justify-center rounded-full font-bold">MOH</div>
            <div>
                <h1 class="text-sm font-bold">MINISTRY OF HEALTH</h1>
                <p class="text-[9px] text-[#555555]">NATIONAL MALARIA CONTROL PROGRAMME • SIERRA LEONE</p>
            </div>
        </div>
    </header>

    <div class="flex flex-1">
        <aside class="sidebar w-64 py-8 flex flex-col justify-between">
            <div class="space-y-2">
                <div class="px-6 text-xl font-bold text-[#11452a] mb-8">Reconciliation</div>
                <div class="nav-item nav-active" onclick="setActive(this, 'Home')">Home</div>
                <div class="nav-item" onclick="setActive(this, 'Registration Management')">Registration Management</div>
                <div class="nav-item" onclick="setActive(this, 'Distribution Management')">Distribution Management</div>
                <div class="nav-item" onclick="setActive(this, 'Reconciliation Management')">Reconciliation Management</div>
                <div class="nav-item" onclick="setActive(this, 'Reports')">Reports</div>
                <div class="nav-item" onclick="setActive(this, 'Analytics')">Analytics</div>
            </div>
            <div class="px-6"><button onclick="alert('Logging out...')" class="bg-[#11452a] text-white w-full py-2 rounded-lg text-sm">Logout</button></div>
        </aside>

        <main class="flex-1 p-8">
            <h2 id="view-title" class="text-xl font-bold mb-6 text-[#11452a]">Home Dashboard</h2>

            <div class="card p-6 mb-8 flex gap-4">
                <div class="flex-1">
                    <label class="text-xs font-bold text-gray-500">DISTRICT</label>
                    <select id="distSelect" onchange="updateChiefdoms()" class="w-full border rounded p-2 mt-1"></select>
                </div>
                <div class="flex-1">
                    <label class="text-xs font-bold text-gray-500">CHIEFDOM</label>
                    <select id="chiefSelect" onchange="updatePHUs()" class="w-full border rounded p-2 mt-1"></select>
                </div>
                <div class="flex-1">
                    <label class="text-xs font-bold text-gray-500">PHU</label>
                    <select id="phuSelect" class="w-full border rounded p-2 mt-1"></select>
                </div>
                <div class="flex items-end gap-2">
                    <button onclick="runReconciliation()" class="btn-primary px-6 py-2 rounded font-semibold text-sm">Run</button>
                    <button onclick="exportData()" class="btn-secondary px-6 py-2 rounded font-semibold text-sm">Export</button>
                </div>
            </div>

            <div class="card overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 uppercase text-xs text-gray-500">
                        <tr><th class="px-6 py-4">District</th><th class="px-6 py-4">Chiefdom</th><th class="px-6 py-4">PHU</th><th class="px-6 py-4">Status</th></tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y"></tbody>
                </table>
            </div>
        </main>
    </div>

    <footer class="bg-[#11452a] text-white text-center py-4 text-xs">Powered by ICF-SL @ 2026</footer>

    <script>
        const slData = {
            "Bo": { "Kakua": ["Bo Central PHU", "Sembehun PHU"], "Bumpe": ["Bumpe Clinic"] },
            "Bombali": { "Makari": ["Makari PHU"], "Bombali Sebora": ["Bombali PHU"] },
            "Bonthe": { "Imperri": ["Imperri PHU"], "Bonthe": ["Bonthe Clinic"] },
            "Falaba": { "Mongo": ["Mongo PHU"], "Sulima": ["Sulima PHU"] },
            "Kailahun": { "Luawa": ["Luawa PHU"], "Jawei": ["Jawei PHU"] },
            "Kambia": { "Magbema": ["Magbema PHU"], "Mambolo": ["Mambolo PHU"] },
            "Karene": { "Sella Limba": ["Sella Limba PHU"], "Sanda Loko": ["Sanda Loko PHU"] },
            "Kenema": { "Nongowa": ["Nongowa PHU"], "Gaura": ["Gaura PHU"] },
            "Koinadugu": { "Wara Wara": ["Wara Wara PHU"], "Dembelia": ["Dembelia PHU"] },
            "Kono": { "Kamara": ["Kamara PHU"], "Tankoro": ["Tankoro PHU"] },
            "Moyamba": { "Kaiyamba": ["Kaiyamba PHU"], "Bagruwa": ["Bagruwa PHU"] },
            "Port Loko": { "Maforki": ["Maforki PHU"], "Bureh": ["Bureh PHU"] },
            "Pujehun": { "Kpanga": ["Kpanga PHU"], "Galliness": ["Galliness PHU"] },
            "Tonkolili": { "Kholifa": ["Kholifa PHU"], "Kunike": ["Kunike PHU"] },
            "Western Rural": { "Waterloo": ["Waterloo PHU"], "Koya": ["Koya PHU"] },
            "Western Urban": { "Freetown City": ["Connaught PHU", "Lumley PHU"] }
        };

        const distSelect = document.getElementById('distSelect');
        const chiefSelect = document.getElementById('chiefSelect');
        const phuSelect = document.getElementById('phuSelect');

        Object.keys(slData).forEach(d => distSelect.innerHTML += `<option value="${d}">${d}</option>`);

        function updateChiefdoms() {
            const d = distSelect.value;
            chiefSelect.innerHTML = Object.keys(slData[d]).map(c => `<option value="${c}">${c}</option>`).join('');
            updatePHUs();
        }

        function updatePHUs() {
            const d = distSelect.value;
            const c = chiefSelect.value;
            phuSelect.innerHTML = slData[d][c].map(p => `<option>${p}</option>`).join('');
        }

        function runReconciliation() {
            document.getElementById('tableBody').innerHTML = `<tr>
                <td class="px-6 py-4">${distSelect.value}</td>
                <td class="px-6 py-4">${chiefSelect.value}</td>
                <td class="px-6 py-4">${phuSelect.value}</td>
                <td class="px-6 py-4 text-[#11452a] font-bold">Reconciled</td>
            </tr>`;
        }

        function setActive(el, title) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-active'));
            el.classList.add('nav-active');
            document.getElementById('view-title').innerText = title;
        }

        function exportData() { alert("Exporting report..."); }

        updateChiefdoms();
    </script>
</body>
</html>
